name: forward-daily

# M4 (ADR-007): one-shot diario, sin daemons. Registra el estado de las 5
# celdas congeladas en ledger/forward.jsonl (hash-chain) y lo commitea: el
# timestamp del remoto actua de sello de tercero. Cuando el orquestador apruebe
# el gate M4, este workflow debe fijarse al tag forward-v1 (jobs.<id>.steps
# checkout con ref: forward-v1) y el motor pasara de estados a fills t+1.

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC, tras el cierre diario y el funding de 00:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Forward one-shot (solo endpoints publicos, sin secretos)
        run: python -m qa.cli forward run
      - name: Commit ledger (append-only)
        run: |
          git config user.name "qa-forward-bot"
          git config user.email "qa-forward@users.noreply.github.com"
          git add ledger/forward.jsonl
          if git diff --cached --quiet; then
            echo "sin cambios (run duplicado o dia sin datos nuevos)"
          else
            git commit -m "forward: registro diario $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
