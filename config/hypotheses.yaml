# Rejilla pre-registrada de hipotesis (v1.3). Espejo legible por maquina de
# docs/PREREGISTRO.md. NORMA: el texto de PREREGISTRO.md manda; si hay divergencia,
# bug. Cambiar esta rejilla tras ver resultados = nueva version del preregistro
# y n_trials += celdas nuevas. Prohibido anadir/quitar celdas en M3.

version: "1.3"
registered_at_utc: "2026-10-26"
max_families: 3

holdout:
  rule: "Ultimos 365 dias del dataset curado en la fecha de congelacion de datos (M1). Se evaluan UNA sola vez al final de M3 con reglas congeladas."
  sealed: true

benchmarks: [buy_hold, buy_hold_vol_target, cash]

accounting:
  trials_table: ledger/trials.duckdb
  non_trial_kinds: [benchmark, null_permutation, synthetic_validation, diagnostic]
  n_trials_rule: >
    n_trials para DSR/Reality-Check = numero de filas DISTINCTAS de configuraciones
    de estrategia ejecutadas y registradas en `trials` (incluidas fallidas/diagnostico),
    con suelo igual al tamano de la rejilla pre-registrada. Nunca un numero manual.
  # Celdas de rejilla x activos evaluados por separado (cada ejecucion = 1 trial):
  #   H1: 12 celdas x {BTCUSDT, ETHUSDT} = 24 trials
  #   H2:  6 celdas x 1 universo          =  6 trials
  #   H3:  4 celdas x {BTCUSDT, ETHUSDT} =  8 trials
  preregistered_cells: { H1: 24, H2: 6, H3: 8, total: 38 }
  grid_cells_raw: { H1: 12, H2: 6, H3: 4 }

success_criteria:
  # Criterio por defecto (ajustado por potencia en M0; ver PREREGISTRO seccion 8)
  dsr_min: 0.95                 # con n_trials real de la tabla trials
  pbo_max: 0.20                 # CSCV sobre la rejilla de la familia
  cost_stress_multiplier: 2.0   # neto positivo tambien con costes x2
  min_fraction_folds_positive: 0.60   # CPCV purgado con embargo
  multiple_testing: "Reality Check/SPA sobre todas las celdas de la familia vs benchmark"
  dsr_gating_for: [H2, H3]        # v1.1 (condicion 3 gate M0): en H1 se computa y reporta, no veta
  h1_primary_multiple_testing: "SPA/Reality Check sobre mejora de delta_maxDD_matched (rejilla 12 celdas por activo)"
  validation_scheme:
    cpcv: { n_splits: 10, n_test_splits: 2 }   # C(10,2) = 45 trayectorias de test
    purge: "eliminar del train las muestras cuya ventana de formacion solape el test"
    embargo_days: { H1: 20, H2: 14, H3: 7 }    # buffer tras el purge (ver PREREGISTRO s6)
    block_bootstrap: { type: stationary, expected_block_days: 20, n_resamples: 10000 }
    hac: "Newey-West con lag = ventana de formacion de la senal"

hypotheses:
  H1:
    family: tendencia_temporal_voltarget
    statement: >
      En BTC y ETH, una regla long/flat de tendencia (cierre > SMA(n), o retorno de L
      dias > 0) con posicion escalada por volatilidad objetivo reduce el max drawdown
      frente a buy&hold manteniendo Sharpe >= buy&hold. NO se espera mas retorno
      absoluto. Criterio primario: reduccion de maxDD (IC 95% pareado excluye 0).
      Sharpe >= B&H se evalua como no-inferioridad direccional con reporte honesto
      de potencia (MDE ~ ver power_analysis).
    assets: [BTCUSDT, ETHUSDT]
    timeframe: 1d
    signals:
      sma: "close[t] > SMA(n)[t]  -> long en t+1"
      ret: "sum(log returns, L days)[t] > 0 -> long en t+1"
    position_sizing: "min(1, sigma_obj / sigma_realized_20d) ; flat => 0"
    rebalance_band: 0.10        # v1.1: solo se opera si |target-actual|>=10pp o hay flip (hallazgo pre-datos de potencia, s9.3)
    benchmark_primary:          # v1.2 (correccion defecto 1 gate M0b: Jensen E[w^2]>=ebar^2)
      kind: vol_matched_bh
      formula: "r_bh_vm[t] = f * r_activo[t]; f = sigma(estrategia neta)/sigma(activo), ex-post DENTRO del periodo de evaluacion; solo para benchmark"
      diagnostics: [exposure_matched_bh, buy_hold_crudo, cash]
      note_jensen: "exposure_matched (e_bar constante) tiene sesgo sistematico contra exposicion variable bajo el nulo (+17pp medidos): SOLO diagnostico"
    permutation_null:           # v1.3: nivel critico calibrado en nulo sintetico
      type: circular_block      # bloques circulares 20d; rotacion completa descartada (FPR 2.8%, potencia 6.8%)
      block_days: 20
      n_permutations: 10000     # 199 en simulaciones de potencia (documentado)
      seed: 20261026
      critical_level_t_star: 0.025   # FPR sintetico 4.36% <= 5% (5000 sims); a 0.05 daba 6.68%
      decision_statistic: p_valor_permutado   # NO el delta_maxDD puntual (E[+4pp] bajo nulo)
    co_metrics: [ulcer_index, calmar, time_underwater]   # v1.1 (condicion 2)
    subperiods_utc: ["2017-08-17/2019-12-31", "2020-01-01/2022-12-31", "2023-01-01/fin_in_sample"]
    composite_rule: "p_perm<=0.025 Y delta_maxDD_volmatched<0 en in-sample completo Y delta_maxDD_volmatched<0 (f por subperiodo) en >=2 de 3 subperiodos, por activo (BTC y ETH)"
    fwer_pipeline_simulated: 0.005   # 200 mundos nulos, 24 candidatas, compuesta Y RC (reports/M0_h1_fwer.md)
    verdict_policy_power: "potencia <50% para todo efecto plantado <=0.5 (potencia v1.2 s9.4): si el test no rechaza, veredicto por defecto INCONTRASTABLE; NO PASA solo con p_adverso<0.05, o holdout opuesto en ambos activos, o C4/C5 claramente en contra"
    grid:
      signal_variant: [sma, ret]        # 2 variantes (decision de interpretacion: ver ADR/PREREGISTRO)
      window: [50, 100, 200]            # n para sma, L para ret
      sigma_obj_annual: [0.15, 0.25]
    cells: 12                            # 2 x 3 x 2 (rejilla disjunta, no producto cruzado)
    evaluated_assets: [BTCUSDT, ETHUSDT] # cada (celda, activo) = 1 trial independiente
    primary_metric: max_drawdown_reduction_vs_matched_exposure_bh
    secondary_metrics: [sharpe_ann_net_vs_bh_crudo, sharpe_vs_matched, ulcer_index, calmar, time_underwater, sortino, expectancy_R]
    note_no_lookahead: "senales calculadas en cierre de t, ejecutadas en t+1 con slippage"

  H2:
    family: momentum_transversal_semanal
    statement: >
      En el universo PIT top-N, ir long del tercil superior por retorno acumulado de
      L semanas (saltando la ultima semana) y rebalancear semanalmente bate al
      universo equiponderado en Sharpe neto de costes.
    universe: pit_top_n                   # ver config/universe.yaml
    rebalance: weekly
    formation_return: "suma de retornos semanales de las L semanas anteriores, EXCLUYENDO la ultima semana"
    portfolio: "long tercil superior, equiponderado, sin cortos"
    grid:
      L_weeks: [4, 12, 26]
      N: [10, 20]
    cells: 6
    primary_metric: sharpe_ann_net_vs_universe_equal_weight
    benchmark: [universe_equal_weight, cash]
    data_start_expected: "2019-01 (profundidad de altcoins liquidas; verificar en M1)"
    thin_universe_note: "v1.1 (P2): pre-2019 el universo PIT es fino; M1 confirmo primer mes con >=20 candidatos: 2019-04"
    data_hygiene:
      policy: mark_only          # v1.3: el guard MARCA, nunca borra
      adjudication_table: config/adjudications.csv   # sellada en v1.3
      real_move: "se conserva INTEGRO (borrar crashes reales favorece a long-only)"
      corporate_action: "ruptura de serie: exclusion del ranking PIT 30 dias + ventanas de formacion que crucen la ruptura invalidan al simbolo ese rebalanceo (slot a caja); sin imputacion"
      delisting_convention: last_observed_price

  H3:
    family: carry_spot_perp_delta_neutral
    statement: >
      La posicion delta-neutral long spot / short perp en BTC y ETH rinde neto
      positivo tras comisiones y funding real cuando la media movil del funding
      anualizado supera el umbral; se compara contra caja (USDT).
    assets: [BTCUSDT, ETHUSDT]
    signal: "mean(funding_rate, window_days) * annualizacion > umbral  -> entrar en t+1; salir cuando cae por debajo"
    annualization: "funding por intervalo x intervalos por ano (intervalo real del simbolo, verificado 8h BTCUSDT)"
    position: "1x spot long + 1x perp short, mismo nocional, sin apalancamiento neto"
    grid:
      window_days: [7, 30]
      threshold_annual: [0.05, 0.10]
    cells: 4
    evaluated_assets: [BTCUSDT, ETHUSDT] # cada (celda, activo) = 1 trial independiente
    primary_metric: mean_daily_net_carry_t_stat_HAC
    benchmark: [cash]
    risks_pregregistered: [basis_blowup, funding_regime_change, ejecucion_asincrona_piernas]
    per_asset_mde_rule:         # v1.1 (P4 gate M0)
      policy: "MDE por activo con su n real; si MDE_ETH > 2 * MDE_BTC => ETH INCONTRASTABLE por separado (BTC sigue con todos los criterios)"
