# Universo point-in-time (PIT). Ver ADR-002.
# Reglas normativas para la reconstruccion del universo en M1/M3.

quote_asset: USDT
venue: binance_spot

# Activos fijos para H1 y H3 (fuera del ranking PIT)
fixed_assets:
  H1: [BTCUSDT, ETHUSDT]
  H3_spot_perp: [BTCUSDT, ETHUSDT]

# Universo transversal para H2: top-N por volumen en dollars, reconstruido mes a mes
pit_universe:
  sizes: [10, 20]              # N del grid de H2 (ver hypotheses.yaml)
  ranking_metric: quote_volume_usdt_trailing_30d_mean_daily
  rebalance: monthly           # el ranking se recalcula el primer dia de cada mes UTC
  point_in_time: true          # solo datos estrictamente anteriores al instante de ranking
  min_listing_age_days: 60     # evita pumps de recien listados
  exclude_at_rank_time:
    status_not_trading: true   # BREAK/HALT en exchangeInfo historico si estuviera disponible
  exclusions:
    quote_assets: [USDC, FDUSD, TUSD, BUSD, DAI, USDP, AEUR, EUR, GBP, XUSD, USD1]
    wrapped_or_duplicates: [WBTC, WBETH, WBNB, BTCB, PAXG]   # PAXG es commodity tokenizado
    leveraged_tokens_suffix: [UP, DOWN, BULL, BEAR]
    fiat_and_stables_bases: [USDC, FDUSD, TUSD, BUSD, DAI, USDP, EUR]
  include_delisted: true       # usar dumps de data.binance.vision (FTTUSDT/LUNA verificados)

# Regla de higiene de datos (congelada en M1, ANTES de cualquier computo de
# estrategia). Motivacion: artefactos de redenominacion/token-swap documentados
# en reports/M1_data_quality.md (LUNAUSDT 2022-05-31 log-ret +12.1;
# VENUSDT 2018-10-19 -9.8; SUNUSDT 2021-06-18 -6.7; COCOSUSDT 2021-01-23 +7.2).
# Umbral GENERICO, no afinado contra resultados: |log-ret| > 5 (~150x).
data_hygiene:
  redenomination_guard_abs_log_return: 5.0
  policy_h2: >
    Symbol-weeks con |log-ret semanal| > 5 quedan excluidas de la formacion del
    ranking y de la cartera; ese slot mantiene caja esa semana. Toda exclusion
    queda auditada (simbolo, semana, valor) en el informe de M3.
  policy_h1_h3: >
    BTC/ETH no tienen redenominaciones conocidas; el guard se aplica igualmente
    por uniformidad y cualquier activacion se registra.
  status: "PRE-datos de estrategia (M1 solo audito calidad); cambio post-M3 = nueva version"

# Sesgos que NO se pueden eliminar (documentar siempre en informes):
known_biases:
  - "Sesgo de supervivencia residual: solo conocemos lo que Binance listo; monedas muertas que nunca cotizaron ahi no existen para nosotros."
  - "exchangeInfo actual no devuelve velas de simbolos BREAK; la historia depende de los dumps diarios de data.binance.vision."
  - "El ranking por volumen usa el propio venue: sesgo de seleccion pro-Binance."

# Fuentes de datos (verificadas en vivo 2026-10-26, ver docs/evidence/binance_probes.json):
sources:
  spot_api: https://api.binance.com/api/v3/klines          # ms; limit max efectivo 1000
  spot_dumps: https://s3-ap-northeast-1.amazonaws.com/data.binance.vision  # XML S3; zips diarios + .CHECKSUM
  um_futures_api: https://fapi.binance.com/fapi/v1/klines  # ms
  um_funding_api: https://fapi.binance.com/fapi/v1/fundingRate  # ms; paginar por startTime
  um_funding_monthly_dumps: data/futures/um/monthly/fundingRate/
history_verified:
  spot_btcusdt_1d_first: "2017-08-17"
  spot_btcusdt_4h_first: "2017-08-17"
  um_btcusdt_1d_api_first: "2019-09-08"
  um_btcusdt_1d_daily_dumps_first: "2019-12-31"
  um_btcusdt_funding_api_first_record: "2019-09-10T08:00Z"
  um_metrics_first: "2020-09-01"
