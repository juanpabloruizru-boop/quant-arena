# Universo point-in-time (PIT). Ver ADR-002.
# Reglas normativas para la reconstruccion del universo en M1/M3.

quote_asset: USDT
venue: binance_spot

# Activos fijos para H1 y H3 (fuera del ranking PIT)
fixed_assets:
  H1: [BTCUSDT, ETHUSDT]
  H3_spot_perp: [BTCUSDT, ETHUSDT]

# Universo transversal para H2: top-N por volumen en dollars, reconstruido mes a mes
pit_universe:
  sizes: [10, 20]              # N del grid de H2 (ver hypotheses.yaml)
  ranking_metric: quote_volume_usdt_trailing_30d_mean_daily
  rebalance: monthly           # el ranking se recalcula el primer dia de cada mes UTC
  point_in_time: true          # solo datos estrictamente anteriores al instante de ranking
  min_listing_age_days: 60     # evita pumps de recien listados
  exclude_at_rank_time:
    status_not_trading: true   # BREAK/HALT en exchangeInfo historico si estuviera disponible
  exclusions:
    quote_assets: [USDC, FDUSD, TUSD, BUSD, DAI, USDP, AEUR, EUR, GBP, XUSD, USD1]
    wrapped_or_duplicates: [WBTC, WBETH, WBNB, BTCB, PAXG]   # PAXG es commodity tokenizado
    leveraged_tokens_suffix: [UP, DOWN, BULL, BEAR]
    fiat_and_stables_bases: [USDC, FDUSD, TUSD, BUSD, DAI, USDP, AEUR, EUR, GBP, XUSD, USD1, PAX, UST, USTC, USDD, GUSD, PYUSD, USDE]
  include_delisted: true       # usar dumps de data.binance.vision (FTTUSDT/LUNA verificados)

# Higiene de datos v1.3 (condicion 1 del gate M1): el guard SOLO MARCA, NUNCA borra.
# Los eventos candidatos son los |log-ret diario| > 5 enumerados en el informe de
# calidad M1 (enumeracion completa in-sample: 5 eventos). Cada evento se adjudica
# contra anuncios oficiales (URL+fecha) SIN mirar P&L de ninguna estrategia:
#   - corporate_action: ruptura de serie (swap/redenominacion/relistado). Tratamiento:
#       * el simbolo queda EXCLUIDO del ranking PIT durante exclusion_days tras el evento;
#       * las velas a ambos lados de la ruptura se MARCAN (flags, no se borran ni imputan);
#       * en H2, toda ventana de formacion que cruce la fecha de ruptura invalida al
#         simbolo para ese rebalanceo (se audita en M3).
#   - real_move: movimiento autentico del MISMO token (p. ej. colapso Terra 2022-05-12).
#       Se conserva INTEGRO. Borrar crashes reales favoreceria a las estrategias long-only.
#   - Regla de evidencia: sin anuncio oficial localizable => real_move por defecto
#       (conservador con los datos, no con el P&L).
# Tabla de adjudicacion sellada en v1.3: config/adjudications.csv (hash en PREREGISTRO s10).
data_hygiene:
  guard_abs_log_return: 5.0            # umbral de MARCADO (no de borrado)
  policy: mark_only
  adjudication_table: config/adjudications.csv
  corporate_action_exclusion_days: 30  # exclusion del ranking PIT tras ruptura
  imputation: never                    # prohibido imputar
  delisting_convention: last_observed_price  # posicion mantenida al ultimo precio observado; sin retornos posteriores ni imputacion
  status: "v1.3 sellada con hashes (PREREGISTRO s10); cambios post-M3 = nueva version"

# Auditoria de exclusiones del universo (condicion 2 del gate M1), 2026-10-26:
# exchangeInfo USDT TRADING+BREAK: 770 pares -> 702 elegibles; excluidos en ingesta:
#   15 stablecoin/fiat (TUSD,PAX,USDC,BUSD,EUR,GBP,DAI,USDP,...),
#   50 tokens apalancados (BULL/BEAR/UP/DOWN),
#   3 wrapped/pegged (PAXG, WBTC, WBETH).
# Verificado: 0 excluidos presentes en spot_monthly, pool o PIT top-40.
exclusions_audit:
  usdt_pairs_total: 770
  eligible: 702
  excluded_stablecoins: 15
  excluded_leveraged: 50
  excluded_wrapped_pegged: 3
  leaked_into_ingest: 0
  verified_at_utc: "2026-10-26T20:05:00Z"

# Sesgos que NO se pueden eliminar (documentar siempre en informes):
known_biases:
  - "Sesgo de supervivencia residual: solo conocemos lo que Binance listo; monedas muertas que nunca cotizaron ahi no existen para nosotros."
  - "exchangeInfo actual no devuelve velas de simbolos BREAK; la historia depende de los dumps diarios de data.binance.vision."
  - "El ranking por volumen usa el propio venue: sesgo de seleccion pro-Binance."

# Fuentes de datos (verificadas en vivo 2026-10-26, ver docs/evidence/binance_probes.json):
sources:
  spot_api: https://api.binance.com/api/v3/klines          # ms; limit max efectivo 1000
  spot_dumps: https://s3-ap-northeast-1.amazonaws.com/data.binance.vision  # XML S3; zips diarios + .CHECKSUM
  um_futures_api: https://fapi.binance.com/fapi/v1/klines  # ms
  um_funding_api: https://fapi.binance.com/fapi/v1/fundingRate  # ms; paginar por startTime
  um_funding_monthly_dumps: data/futures/um/monthly/fundingRate/
history_verified:
  spot_btcusdt_1d_first: "2017-08-17"
  spot_btcusdt_4h_first: "2017-08-17"
  um_btcusdt_1d_api_first: "2019-09-08"
  um_btcusdt_1d_daily_dumps_first: "2019-12-31"
  um_btcusdt_funding_api_first_record: "2019-09-10T08:00Z"
  um_metrics_first: "2020-09-01"
